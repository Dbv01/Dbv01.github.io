<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore | Магазин электроники</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* Основные стили */
        :root {
            --primary: #2563eb;
            --secondary: #7c3aed;
            --accent: #f59e0b;
            --dark: #1f2937;
            --light: #f8fafc;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Навигация */
        .navbar {
            background: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            padding: 1rem 0;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            color: var(--secondary);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--dark);
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* Кнопки */
        .btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }

        .btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }

        .btn-success {
            background: var(--success);
        }

        .btn-danger {
            background: var(--danger);
        }

        /* Модальные окна */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gray);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Страницы */
        .page {
            display: none;
            margin-top: 80px;
            padding: 2rem 0;
        }

        .page.active {
            display: block;
        }

        /* Товары */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .product-image {
            height: 180px;
            background: linear-gradient(135deg, #e2e8f0, #cbd5e1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-info {
            padding: 1.5rem;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .product-price {
            color: var(--primary);
            font-size: 1.3rem;
            font-weight: 700;
            margin: 1rem 0;
        }

        /* Корзина */
        .cart-items {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .cart-item {
            display: flex;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item-image {
            width: 80px;
            height: 80px;
            background: #e2e8f0;
            border-radius: 8px;
            margin-right: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-price {
            font-weight: 600;
            color: var(--primary);
        }

        .cart-total {
            text-align: right;
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 2rem;
            color: var(--primary);
        }

        /* Заказы */
        .orders-list {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
        }

        .order-card {
            padding: 1.5rem;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            margin-bottom: 1rem;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .order-number {
            font-weight: 600;
            color: var(--primary);
        }

        .order-status {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-processing {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-shipped {
            background: #dcfce7;
            color: #166534;
        }

        .status-delivered {
            background: #f3e8ff;
            color: #5b21b6;
        }

        /* Админ панель */
        .admin-controls {
            background: white;
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 2rem;
        }

        /* Уведомления */
        .notification {
            position: fixed;
            top: 100px;
            right: 20px;
            background: white;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: none;
            align-items: center;
            gap: 1rem;
            z-index: 3000;
            animation: slideIn 0.3s ease;
        }

        .notification.active {
            display: flex;
        }

        .notification.success {
            border-left: 4px solid var(--success);
        }

        .notification.error {
            border-left: 4px solid var(--danger);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            
            .products-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-container">
                <a href="#" class="logo">
                    <i class="fas fa-laptop-code"></i> TechStore
                </a>
                
                <div class="nav-links">
                    <a href="#" onclick="showPage('home')">Главная</a>
                    <a href="#" onclick="showPage('products')">Товары</a>
                    <a href="#" onclick="showPage('cart')">Корзина (<span id="cart-count">0</span>)</a>
                    <a href="#" onclick="showPage('orders')">Мои заказы</a>
                    <div id="user-section">
                        <a href="#" class="btn btn-outline" onclick="showAuthModal()">Войти</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Модалка авторизации -->
    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="auth-title">Вход в аккаунт</h3>
                <button class="close-modal" onclick="closeAuthModal()">&times;</button>
            </div>
            <div id="auth-form">
                <!-- Форма будет генерироваться через JS -->
            </div>
        </div>
    </div>

    <!-- Модалка оформления заказа -->
    <div id="checkout-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Оформление заказа</h3>
                <button class="close-modal" onclick="closeCheckoutModal()">&times;</button>
            </div>
            <form id="checkout-form">
                <div class="form-group">
                    <label>Имя и Фамилия</label>
                    <input type="text" id="full-name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="order-email" required>
                </div>
                <div class="form-group">
                    <label>Телефон</label>
                    <input type="tel" id="phone" required>
                </div>
                <div class="form-group">
                    <label>Адрес доставки</label>
                    <textarea id="address" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label>Комментарий к заказу</label>
                    <textarea id="comment" rows="2"></textarea>
                </div>
                <button type="submit" class="btn btn-success" style="width: 100%;">Подтвердить заказ</button>
            </form>
        </div>
    </div>

    <!-- Уведомление -->
    <div id="notification" class="notification">
        <i id="notification-icon"></i>
        <span id="notification-text"></span>
    </div>

    <!-- Страница Главная -->
    <div id="home-page" class="page active">
        <div class="container">
            <div class="hero" style="text-align: center; padding: 4rem 0;">
                <h1 style="font-size: 3rem; margin-bottom: 1rem;">Добро пожаловать в TechStore!</h1>
                <p style="font-size: 1.2rem; color: #6b7280; margin-bottom: 2rem;">Лучшая электроника по лучшим ценам</p>
                <button class="btn" onclick="showPage('products')">Начать покупки</button>
            </div>
        </div>
    </div>

    <!-- Страница Товары -->
    <div id="products-page" class="page">
        <div class="container">
            <h2>Наши товары</h2>
            <div class="products-grid" id="products-list">
                <!-- Товары будут генерироваться через JS -->
            </div>
        </div>
    </div>

    <!-- Страница Корзина -->
    <div id="cart-page" class="page">
        <div class="container">
            <h2>Ваша корзина</h2>
            <div class="cart-items" id="cart-items">
                <p style="text-align: center; padding: 2rem;">Корзина пуста</p>
            </div>
            <div id="cart-total-section" style="display: none;">
                <div class="cart-total">
                    Итого: <span id="cart-total-price">0</span> ₽
                </div>
                <div style="text-align: right; margin-top: 1rem;">
                    <button class="btn btn-success" onclick="showCheckoutModal()">Оформить заказ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Страница Мои заказы -->
    <div id="orders-page" class="page">
        <div class="container">
            <h2>Мои заказы</h2>
            <div class="orders-list" id="orders-list">
                <p style="text-align: center; padding: 2rem;">У вас нет заказов</p>
            </div>
        </div>
    </div>

    <!-- Админ панель (доступна только админу) -->
    <div id="admin-page" class="page">
        <div class="container">
            <h2>Админ панель</h2>
            <div class="admin-controls">
                <h3>Управление заказами</h3>
                <div id="admin-orders-list">
                    <p>Загрузка заказов...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Подключаем JavaScript -->
    <script src="script.js"></script>
</body>
</html>
